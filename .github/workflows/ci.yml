name: Oracis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop Linux x86-64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang ninja-build python3 pkg-config \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Validate Python tooling
        run: |
          python3 -m py_compile \
            tools/ndsrecomp/build_recompiler.py \
            tools/ndsrecomp/extract_nds_programs.py \
            tools/ndsrecomp/emit_platinum_banks.py \
            tools/ndsrecomp/audit_bank_symbols.py \
            tools/ndsrecomp/patch_memory_access_direction.py \
            tools/ndsrecomp/split_generated_bank.py \
            tools/ndsrecomp/validate_platinum_bank_set.py
          python3 -m unittest discover \
            --start-directory tests/tools \
            --pattern 'test_*.py' \
            --verbose

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify optional local static-bank build
        run: |
          cmake -S . -B build \
            -DORACIS_LOCAL_BANK_DIR="$GITHUB_WORKSPACE/tests/fixtures/static_banks" \
            -DORACIS_ALLOW_SYNTHETIC_BANKS=ON
          cmake --build build --target oracis_compiled_bank_link_smoke --parallel
          ctest --test-dir build -R oracis_compiled_bank_link_smoke --output-on-failure
          cmake --build build --target oracis_audit_platinum_bank_symbols --parallel

  runtime-tests:
    name: ARM runtime tests (no SDL3 dependency)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Oracis
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build

      - name: Configure runtime-only build
        run: |
          cmake -S . -B build-runtime -G Ninja \
            -DORACIS_BUILD_HOST=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build runtime tests
        run: cmake --build build-runtime --parallel

      - name: Run runtime tests
        run: ctest --test-dir build-runtime --output-on-failure

  ndsrecomp-static-compiler:
    name: Pinned NDSRecomp static compiler (no runner)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Oracis
        uses: actions/checkout@v4

      - name: Install compiler build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build python3

      - name: Build only nds_recompile
        run: |
          CC=clang CXX=clang++ python3 tools/ndsrecomp/build_recompiler.py \
            --source "$RUNNER_TEMP/ndsrecomp-source" \
            --build-dir "$RUNNER_TEMP/ndsrecomp-build"

      # This artifact is the pinned developer compiler only. The job never
      # receives a ROM, extracted segment, generated bank, or game-derived file.
      - name: Stage pinned compiler binary
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(find "$RUNNER_TEMP/ndsrecomp-build" -type f \
            -name nds_recompile -perm -u+x -print -quit)"
          test -n "$compiler"
          output="$RUNNER_TEMP/oracis-ndsrecomp-artifact"
          mkdir -p "$output/tools/ndsrecomp" "$output/include/oracis/recomp"
          install -m 0755 "$compiler" "$output/nds_recompile"
          install -m 0644 tools/ndsrecomp/extract_nds_programs.py "$output/tools/ndsrecomp/"
          install -m 0644 tools/ndsrecomp/emit_platinum_banks.py "$output/tools/ndsrecomp/"
          install -m 0644 tools/ndsrecomp/audit_bank_symbols.py "$output/tools/ndsrecomp/"
          install -m 0644 tools/ndsrecomp/patch_memory_access_direction.py "$output/tools/ndsrecomp/"
          for header in runtime_arm.h arm_cpu_state.h arm_cpu_state_ops.h arm_flags.h runtime_event_trace.h; do
            install -m 0644 "include/oracis/recomp/$header" "$output/include/oracis/recomp/$header"
          done
          cat > "$output/README.txt" <<'EOF'
          Oracis local tooling artifact: pinned NDSRecomp compiler, extraction/emission tools, memory direction adapter and ABI headers.
          Upstream revision: 14b7e15023e9affc9dc375e4e611ac703f5c76ab
          Includes the compiler, Oracis extraction/emission scripts, the generated-bank memory direction adapter, and the Oracis-owned
          C ABI headers needed to compile locally generated bank objects.
          No ROM, BIOS, extracted segment, generated bank or game data is included.
          The scripts only read user-provided local game files and write generated output locally.
          EOF
          (
            cd "$output"
            sha256sum nds_recompile tools/ndsrecomp/extract_nds_programs.py \
              tools/ndsrecomp/emit_platinum_banks.py \
              tools/ndsrecomp/audit_bank_symbols.py \
              tools/ndsrecomp/patch_memory_access_direction.py \
              include/oracis/recomp/*.h > SHA256SUMS
          )

      - name: Upload pinned compiler for local bank generation
        uses: actions/upload-artifact@v4
        with:
          name: ndsrecomp-static-compiler-linux-x86_64
          path: ${{ runner.temp }}/oracis-ndsrecomp-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android-arm64:
    name: Android ARM64 native library
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Android native library
        run: cmake --build build-android --parallel
